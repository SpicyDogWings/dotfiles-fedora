version = 2

[common]
synced_files = []

[[profiles]]
name = "default"
synced_files = [
    ".config/alacritty",
    ".config/fish",
    ".config/ghostty",
    ".config/helix",
    ".config/herdr/config.toml",
    ".config/niri",
    ".config/noctalia",
    ".config/nushell/config.nu",
    ".config/nushell/env.nu",
    ".config/nushell/startship.nu",
    ".config/starship.toml",
    ".config/yazi",
    ".config/zed",
    ".config/zellij",
    ".var/app/io.typora.Typora/config/Typora/themes",
    "Music/rename_mp3.sh",
]

[[profiles.packages]]
name = "yazi"
description = "File Manager"
manager = "custom"
binary_name = "yazi"
install_command = "./package_scripts/yazi.sh"
existence_check = "yazi"

[[profiles.packages]]
name = "fzf"
description = "Fuzy Finder"
manager = "dnf"
package_name = "fzf"
binary_name = "fzf"

[[profiles.packages]]
name = "helix"
description = "Editor de terminal"
manager = "dnf"
package_name = "helix"
binary_name = "hx"

[[profiles.packages]]
name = "lazyssh"
description = "Administrador de claves ssh en terminal"
manager = "custom"
binary_name = "lazyssh"
install_command = "./package-scripts/lazyssh.sh"
existence_check = "which lazyssh"

[[profiles.packages]]
name = "pandora"
description = "Un toolkit para realizar scripts iteractivos"
manager = "cargo"
package_name = "pandora-kit"
binary_name = "pandora"

[[profiles.packages]]
name = "herdr"
description = "Un miltiplezador para la era agentica"
manager = "custom"
binary_name = "herdr"
install_command = "curl -fsSL https://herdr.dev/install.sh | sh"

[[profiles.packages]]
name = "noctalia"
description = "Shell de wayland"
manager = "dnf"
package_name = "noctalia"
binary_name = "noctalia"

[[profiles.packages]]
name = "niri"
description = "Compositor de ventanas wayland"
manager = "dnf"
package_name = "niri"
binary_name = "niri"
