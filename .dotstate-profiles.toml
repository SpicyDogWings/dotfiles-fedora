version = 2

[common]
synced_files = []

[[profiles]]
name = "default"
synced_files = [
    ".config/alacritty",
    ".config/fastfetch",
    ".config/fish",
    ".config/ghostty",
    ".config/helix",
    ".config/herdr/config.toml",
    ".config/niri",
    ".config/noctalia",
    ".config/nushell/config.nu",
    ".config/nushell/env.nu",
    ".config/nushell/startship.nu",
    ".config/starship.toml",
    ".config/yazi",
    ".config/zed",
    ".config/zellij",
    ".local/share/backgrounds",
    ".local/share/fonts/CommitMono",
    ".var/app/io.typora.Typora/config/Typora/themes",
    "Music/rename_mp3.sh",
]

[[profiles.packages]]
name = "yazi"
description = "File Manager"
manager = "custom"
binary_name = "yazi"
install_command = "/home/sheepcode/.config/dotstate/storage/scripts"
existence_check = "yazi"

[[profiles.packages]]
name = "fzf"
description = "Fuzy Finder"
manager = "dnf"
package_name = "fzf"
binary_name = "fzf"

[[profiles.packages]]
name = "helix"
description = "Editor de terminal"
manager = "dnf"
package_name = "helix"
binary_name = "hx"

[[profiles.packages]]
name = "lazyssh"
description = "Administrador de claves ssh en terminal"
manager = "custom"
binary_name = "lazyssh"
install_command = "./package-scripts/lazyssh.sh"
existence_check = "which lazyssh"

[[profiles.packages]]
name = "pandora"
description = "Un toolkit para realizar scripts iteractivos"
manager = "cargo"
package_name = "pandora-kit"
binary_name = "pandora"

[[profiles.packages]]
name = "herdr"
description = "Un miltiplezador para la era agentica"
manager = "custom"
binary_name = "herdr"
install_command = "curl -fsSL https://herdr.dev/install.sh | sh"

[[profiles.packages]]
name = "noctalia"
description = "Shell de wayland"
manager = "dnf"
package_name = "noctalia"
binary_name = "noctalia"

[[profiles.packages]]
name = "niri"
description = "Compositor de ventanas wayland"
manager = "dnf"
package_name = "niri"
binary_name = "niri"

[[profiles.packages]]
name = "fish"
description = "Ena shell moderna escrita en rust"
manager = "dnf"
package_name = "fish"
binary_name = "fish"

[[profiles.packages]]
name = "eza"
description = "Remplazo moderno de exa"
manager = "dnf"
package_name = "eza"
binary_name = "eza"

[[profiles.packages]]
name = "starship"
description = "Configuracion de shell"
manager = "custom"
binary_name = "starship"
install_command = "./scripts/install-starship.sh"
existence_check = "starship"

[[profiles.packages]]
name = "cargo"
description = "Administrador de paquetes con rust"
manager = "custom"
binary_name = "cargo"
install_command = "./install.sh"
existence_check = "cargo"

[[profiles.packages]]
name = "gitwig"
description = "Una herramienta completa para git"
manager = "custom"
binary_name = "./install"
install_command = "gitwig"
existence_check = "gitwig"

[[profiles.packages]]
name = "bashtop"
description = "Monitor de recursos de la terminal"
manager = "dnf"
package_name = "btop"
binary_name = "btop"

[[profiles.packages]]
name = "ekphos"
description = "Editor de markdown"
manager = "cargo"
package_name = "ekphos"
binary_name = "ekphos"

[[profiles.packages]]
name = "uv"
description = "Instalador de programas python"
manager = "custom"
binary_name = "uv"
install_command = "~/.config/dotstate/storage/scripts/install-uv.sh"

[[profiles.packages]]
name = "graphify"
description = "Memory code base para proyectos"
manager = "custom"
binary_name = "graphify"
install_command = "~/.config/dotstate/storage/scripts/install-graphify.sh"
existence_check = "graphify"

[[profiles]]
name = "2pc"
description = "Second pc, more productiviry"
inherits = "default"
synced_files = [".config/fish"]
packages = []
