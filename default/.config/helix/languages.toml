[[language]]
name = "html"
formatter = { command = "oxfmt", args = ["--stdin-filepath", "stdin.html"] }
language-servers = ["vscode-html-languageserver"]
auto-format = true
[language-server.vscode-html-languageserver]
command = "vscode-html-languageserver"
args = ["--stdio"]


[[language]]
name = "php"
language-servers = ["php-lsp"]
formatter = { command = "mago", args = ["format", "--stdin-input"] }
auto-format = true
[language.debugger]
name = "vscode-php-debug"
transport = "stdio"
command = "node"
args = ["/home/sheepcode/.local/libexec/php-debug/out/phpDebug.js"]
[[language.debugger.templates]]
name = "Listen for Xdebug (brown)"
request = "launch"
completion = ["ignored"]
args = { port = "9003", serverSourceRoot = "/var/www/html/fix-traslados-detalles-miminos", localSourceRoot = "/home/sheepcode/Documentos/release/finanzas-pod/fix-traslados-detalles-miminos" }
[[language.debugger.templates]]
name = "Launch current script"
request = "launch"
completion = ["filename"]
args = { program = "{0}", runtimeExecutable = "php" }
[language-server.php-lsp]
command = "php-lsp"
[language-server.vscode-css-languageserver]
command = "vscode-css-languageserver"
args = ["--stdio"]


[[language]]
name = "vue"
formatter = { command = "oxfmt", args = ["--stdin-filepath", "stdin.html"] }
scope = "source.vue"
injection-regex = "vue"
file-types = ["vue"]
language-servers = ["volar", "oxlint"]
[language-server.volar]
command = "vue-language-server"
args = ["--stdio"]


[language-server.oxlint]
command = "oxlint"
args = ["--lsp"]


[language-server.tailwindcss-language-server]
command = "tailwindcss-language-server"
args = ["--stdio"]


[language-server.emmet-lsp]
command = "emmet-ls"
args = ["--stdio"]


[[language]]
name = "bash"
scope = "source.bash"
file-types = ["sh", "bash"]
comment-token = "#"
indent = { tab-width = 2, unit = "  " }


[[language]]
name = "rust"
formatter = { command = "rustfmt" }
auto-format = true


